<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Survey Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090f;color:#f5f7ff;font:15px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:20px}.card{background:#ffffff09;border:1px solid #ffffff16;border-radius:18px;padding:18px;margin:12px 0}input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ffffff18;border-radius:10px;background:#0b0e15;color:#fff}textarea{min-height:90px}button{padding:10px 14px;border:0;border-radius:10px;background:#202634;color:#fff;cursor:pointer}.primary{background:#fff;color:#080a0f;font-weight:700}.danger{background:#3a1720;color:#ffb7c2}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.muted{color:#9aa4b5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.q{border:1px solid #ffffff12;border-radius:14px;padding:14px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid #ffffff12;border-radius:14px}.stat b{display:block;font-size:25px}.answer{white-space:pre-wrap;background:#05070b;padding:10px;border-radius:9px}@media(max-width:650px){main{padding:10px}.stats{grid-template-columns:1fr}}</style></head><body><main id="app"></main><script>
const API='https://survey-api-livid-seven.vercel.app',USER='https://survey-api-livid-seven.vercel.app/s/';let token=localStorage.getItem('nexus_admin_token');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(API+path,opt),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function login(){app.innerHTML='<div class="card" style="max-width:420px;margin:12vh auto"><h1>Nexus Survey Admin</h1><p class="muted">Secure management panel</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="primary" style="width:100%" onclick="doLogin()">Sign in</button></div>'}
async function doLogin(){try{let r=await fetch(API+'/api/admin_login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),d=await r.json();if(!r.ok)throw Error();token=d.token;localStorage.setItem('nexus_admin_token',token);dashboard()}catch{alert('Invalid login')}}
async function dashboard(){try{let d=await api('/api/surveys'),s=d.surveys||[];app.innerHTML='<div class="row"><h1 class="grow">Nexus Survey Admin</h1><button onclick="logout()">Logout</button></div><div class="stats"><div class="stat">Surveys<b>'+s.length+'</b></div><div class="stat">Active<b>'+s.filter(x=>x.is_active).length+'</b></div><div class="stat">Responses<b>'+s.reduce((n,x)=>n+Number(x.survey_responses?.[0]?.count||0),0)+'</b></div></div><div class="actions"><button class="primary" onclick="builder()">+ Create Survey</button></div><div id="list">'+(s.length?s.map(card).join(''):'<div class="card muted">No surveys yet.</div>')+'</div>'}catch{logout()}}
function card(s){return '<div class="card"><h2>'+esc(s.title)+'</h2><p class="muted">'+esc(s.description||'No description')+'</p><p class="muted">'+new Date(s.created_at).toLocaleString()+' · '+Number(s.survey_responses?.[0]?.count||0)+' responses · '+(s.is_active?'Active':'Inactive')+'</p><div class="actions"><button onclick="copyLink('+JSON.stringify(USER+s.id)+')">Copy link</button><button onclick="responses('+JSON.stringify(s.id)+')">Responses</button><button onclick="edit('+JSON.stringify(s.id)+')">Edit</button><button onclick="toggle('+JSON.stringify(s.id)+','+(!s.is_active)+')">'+(s.is_active?'Deactivate':'Reactivate')+'</button><button class="danger" onclick="removeSurvey('+JSON.stringify(s.id)+')">Delete</button></div></div>'}
function builder(existing){app.innerHTML='<div class="row"><h1 class="grow">'+(existing?'Edit':'Create')+' Survey</h1><button onclick="dashboard()">Back</button></div><div class="card"><input id="title" maxlength="180" placeholder="Survey title" value="'+esc(existing?.title||'')+'"><textarea id="desc" placeholder="Description">'+esc(existing?.description||'')+'</textarea><div id="qs"></div><div class="actions"><button onclick="addQ()">+ Add question</button><button class="primary" onclick="save('+JSON.stringify(existing?.id||'')+')">Save</button></div></div>';(existing?.questions||[]).forEach(addQ);if(!existing?.questions?.length)addQ()}
function addQ(d={}){let e=document.createElement('div');e.className='q';e.dataset.id=d.id||'q_'+Date.now()+Math.random().toString(36).slice(2);e.innerHTML='<input class="text" placeholder="Question" value="'+esc(d.text||d.label||'')+'"><select class="type"><option>text</option><option>textarea</option><option>radio</option><option>checkbox</option></select><label><input class="req" type="checkbox" style="width:auto"> Required</label><div class="ops"></div><button class="danger" onclick="this.parentElement.remove()">Delete</button>';qs.appendChild(e);e.querySelector('.type').value=d.type||'text';e.querySelector('.req').checked=!!d.required;e.querySelector('.type').onchange=()=>options(e);options(e,d.options||[])}
function options(e,v=[]){let t=e.querySelector('.type').value;e.querySelector('.ops').innerHTML=t==='radio'||t==='checkbox'?'<textarea class="op" placeholder="One option per line">'+esc(v.join('\n'))+'</textarea>':''}
async function save(id){let questions=[...document.querySelectorAll('.q')].map(e=>({id:e.dataset.id,text:e.querySelector('.text').value.trim(),type:e.querySelector('.type').value,required:e.querySelector('.req').checked,options:[...(e.querySelector('.op')?.value||'').split('\n')].map(x=>x.trim()).filter(Boolean)}));if(!title.value.trim()||!questions.length||questions.some(q=>!q.text))return alert('Complete title and questions');try{await api(id?'/api/surveys?id='+id:'/api/surveys',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value.trim(),description:desc.value,questions})});dashboard()}catch(e){alert(e.message)}}
async function edit(id){try{builder((await api('/api/surveys?id='+id)).survey)}catch(e){alert(e.message)}}
async function toggle(id,v){try{await api('/api/surveys?id='+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:v})});dashboard()}catch(e){alert(e.message)}}
async function removeSurvey(id){if(confirm('Delete survey and all responses permanently?')){await api('/api/surveys?id='+id,{method:'DELETE'});dashboard()}}
async function responses(id){try{let d=await api('/api/admin_responses?survey_id='+id);app.innerHTML='<div class="row"><h1 class="grow">Responses</h1><button onclick="dashboard()">Back</button></div>'+(d.responses||[]).map(r=>'<div class="card"><h3>'+esc(r.name)+'</h3><p>'+esc(r.email)+(r.phone?' · '+esc(r.phone):'')+'</p><p class="muted">'+new Date(r.submitted_at).toLocaleString()+'</p><div class="answer">'+esc(JSON.stringify(r.answers,null,2))+'</div><div class="actions"><button class="danger" onclick="delResponse('+JSON.stringify(r.id)+','+JSON.stringify(id)+')">Delete</button></div></div>').join('')||'<div class="card muted">No responses found.</div>'}catch(e){alert(e.message)}}
async function delResponse(id,s){if(confirm('Delete response?')){await api('/api/admin_responses?id='+id,{method:'DELETE'});responses(s)}}
async function copyLink(x){try{await navigator.clipboard.writeText(x);alert('Link copied')}catch{prompt('Copy link',x)}}
function logout(){token=null;localStorage.removeItem('nexus_admin_token');login()}if(token)dashboard();else login();
</script></body></html>
